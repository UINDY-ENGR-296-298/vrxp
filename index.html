<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>AFrame+WebXR</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- A-Frame (pinned to version compatible with extras v4.1.2) -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>

    <!-- Physics system -->
    <script src="https://cdn.jsdelivr.net/npm/aframe-physics-system@4.0.1/dist/aframe-physics-system.min.js"></script>

    <!-- aframe-extras v4.1.2 (has kinematic-body + movement-controls) -->
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v4.1.2/dist/aframe-extras.min.js"></script>

    <!-- Your component + app code -->
    <script src="components/blankwall.js"></script>
    <script src="index.js"></script>
    <!-- Sky -->
    <script src="skybox/alt_sky.js"></script>

</head>
<body>

<a-scene
        renderer="colorManagement: true; physicallyCorrectLights: true"
        physics="gravity: -9.8; debug: false"
        skybox-box="path: ./skybox/; ext: .jpg; rotTop: 1.5708; rotBottom: -1.5708">

    <!-- Player RIG with collisions -->

<!--    <a-entity id="rig"-->
<!--              position="0 2 0"-->
<!--              movement-controls-->
<!--              kinematic-body="radius: 0.35; height: 1.6; offset: 0 0.8 0">-->
<!--        <a-entity camera look-controls position="0 1.6 0"></a-entity>-->
<!--    </a-entity>-->

    <a-assets>
        <img id="groundTexture" src="concrete.jpg" alt="">
        <img id="skyTexture" src="fantasy_sky.jpg" alt="">
    </a-assets>

<!------------------------------------------------------------------------------------------------------>
<!--                                          Main Hallway                                            -->
<!------------------------------------------------------------------------------------------------------>

    <!-- Blank wall to the right -->
    <a-entity
        blank-wall="width: 60; height: 3; thickness: 0.5; units: ft; color: #eaeaea; anchor: ground"
        position="9 0 0"
        rotation="0 90 0">
    </a-entity>

    <!-- Blank wall to the left -->
    <a-entity
        blank-wall="width: 60; height: 3; thickness: 0.5; units: ft; color: #eaeaea; anchor: ground"
        position="-9 0 0"
        rotation="0 90 0">
    </a-entity>

    <!-- Blank wall behind -->
    <a-entity
        blank-wall="width: 60; height: 3; thickness: 0.5; units: ft; color: #eaeaea; anchor: ground"
        position="0 0 9"
        rotation="0 0 0">
    </a-entity>

    <!-- Blank wall front-left -->
    <a-entity
        blank-wall="width: 20; height: 3; thickness: 0.5; units: ft; color: #eaeaea; anchor: ground"
        position="-6 0 -9"
        rotation="0 0 0">
    </a-entity>

    <!-- Blank wall front-right -->
    <a-entity
        blank-wall="width: 20; height: 3; thickness: 0.5; units: ft; color: #eaeaea; anchor: ground"
        position="6 0 -9"
        rotation="0 0 0">
    </a-entity>

    <!-- Blank wall hallway left -->
    <a-entity
        blank-wall="width: 20; height: 3; thickness: 0.5; units: ft; color: #eaeaea; anchor: ground"
        position="-3 0 -12"
        rotation="0 90 0">
    </a-entity> 
    <a-entity
        blank-wall="width: 10; height: 3; thickness: 0.5; units: ft; color: #eaeaea; anchor: ground"
        position="-3 0 -19.5"
        rotation="0 90 0">
    </a-entity> 
    
    <!-- Blank wall hallway right -->
    <a-entity
        blank-wall="width: 40; height: 3; thickness: 0.5; units: ft; color: #eaeaea; anchor: ground"
        position="3 0 -15"
        rotation="0 90 0">
    </a-entity> 

    <!-- Blank wall end of hallway -->
    <a-entity
        blank-wall="width: 20; height: 3; thickness: 0.5; units: ft; color: #eaeaea; anchor: ground"
        position="0 0 -21"
        rotation="0 0 0">
    </a-entity>


    <!-- Reliable ground collider -->
    <a-plane id="ground" src="#groundTexture"
             rotation="-90 0 0" width="1000" height="1000"
             static-body="shape: box"></a-plane>

</a-scene>

</body>
</html>
