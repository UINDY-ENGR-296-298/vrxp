<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>AFrame+WebXR</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- A-Frame (pinned to version compatible with extras v4.1.2) -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>

    <!-- Physics system -->
    <script src="https://cdn.jsdelivr.net/npm/aframe-physics-system@4.0.1/dist/aframe-physics-system.min.js"></script>

    <!-- aframe-extras v4.1.2 (has kinematic-body + movement-controls) -->
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v4.1.2/dist/aframe-extras.min.js"></script>

    <!-- Your component + app code -->
    <script src="components/blankwall.js"></script>
    <script src="index.js"></script>
    <!-- Sky -->
    <script src="skybox/alt_sky.js"></script>

</head>
<body>

<a-scene
        renderer="colorManagement: true; physicallyCorrectLights: true"
        physics="gravity: -9.8; debug: true"
        skybox-box="path: ./skybox/; ext: .jpg; rotTop: 1.5708; rotBottom: -1.5708">

    <!-- Player RIG with collisions -->

<!--    <a-entity id="rig"-->
<!--              position="0 2 0"-->
<!--              movement-controls-->
<!--              kinematic-body="radius: 0.35; height: 1.6; offset: 0 0.8 0">-->
<!--        <a-entity camera look-controls position="0 1.6 0"></a-entity>-->
<!--    </a-entity>-->

    <a-assets>
        <img id="groundTexture" src="concrete.jpg" alt="">
        <img id="skyTexture" src="fantasy_sky.jpg" alt="">
    </a-assets>

    <!-- Tall boxes: collideable -->
    <a-entity geometry="primitive: box; depth: 10; height: 100; width: 10"
              material="shader: standard; color: black"
              position="100 50 50"></a-entity>

    <a-entity geometry="primitive: box; depth: 10; height: 100; width: 10"
              material="shader: standard; color: black"
              position="50 50 100"
              random-color></a-entity>

    <a-entity geometry="primitive: box; depth: 10; height: 100; width: 10"
              material="shader: standard; color: black"
              position="0 50 50"
              random-color></a-entity>

    <a-entity geometry="primitive: box; depth: 10; height: 100; width: 10"
              material="shader: standard; color: black"
              position="50 50 0"
              random-color></a-entity>

    <!-- Thin diamond floor plate -->
    <a-entity geometry="primitive: box; depth: 90; height: 0.1; width: 90"
              material="shader: standard; color: black"
              position="50 0.2 50"
              rotation="0 45 0"
              random-color
              static-body="shape: box"></a-entity>

    <!-- Blank wall -->
    <a-entity
        blank-wall="width: 20; height: 20; thickness: 0.5; units: ft; color: #eaeaea; anchor: ground"
        position="4 1 0"
        rotation="0 90 0">
    </a-entity>

    <!-- Reliable ground collider -->
    <a-plane id="ground" src="#groundTexture"
             rotation="-90 0 0" width="1000" height="1000"
             static-body="shape: box"></a-plane>

</a-scene>

</body>
</html>
