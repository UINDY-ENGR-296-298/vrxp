<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>VRXP - Classroom</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- A-Frame (pinned to version compatible with extras v4.1.2) -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <!-- Physics system -->
    <!-- <script src="https://cdn.jsdelivr.net/npm/aframe-physics-system@4.0.1/dist/aframe-physics-system.min.js"></script> -->

    <!-- Components -->
    <script src="components/collision.js"></script>
    <script src="components/blankwall.js"></script>
    <script src="components/chair.js"></script>
    <script src="components/table.js"></script>
    <script src="components/projector.js"></script>
    <script src="components/whiteboard.js"></script>
    <script src="components/projection-screen.js"></script>
    <script src="components/double-door.js"></script>
    <script src="components/window-pane.js"></script>
    <script src="components/ceiling-light-square.js"></script>
    <script src="components/air-vent.js"></script>
    <script src="components/classroom-floor.js"></script>
    <script src="components/wasd-move.js"></script>
    <script src="components/arrow-look.js"></script>
    <script src="components/teleport-pad.js"></script>
    <script src="components/scene-fade.js"></script>
    <!-- <script src="components/chair_component.js"></script> -->
    <!-- <script src="components/videoscreen.js"></script> -->

    <!-- Sky -->
    <script src="skybox/skycomponent.js"></script>

    <!-- Classroom -->
    <script src="components/ComplexComponents/classroom_function.js"></script>

    <!-- Dynamic elements -->
    <script src="components/hud.js"></script>
    <script src="components/cookies.js"></script>

    <link rel="icon" href="images/favicon.ico">

    <style>
      html, body { margin:0; height:100%; }
      .hud { position:absolute; top:8px; left:10px; font:14px system-ui; color:#fff; background:rgba(0, 0, 0, 0.35); padding:6px 8px; border-radius:6px; }
    </style>

  </head>

  <body>
    <a-scene
      scene-fade="duration: 800"
      renderer="colorManagement: true; physicallyCorrectLights: true"
      skybox-box="path: ./skybox/; ext: .jpg; rotTop: 1.5708; rotBottom: -1.5708; size: 1000">

      <!-- LIGHTS -->
      <a-entity light="type: ambient; intensity: 0.45"></a-entity>
      <a-entity light="type: directional; intensity: 1.0" position="2 6 2"></a-entity>

      <!-- create camera obj -->
      <a-entity id="rig"
        wasd-move-only="speed:10"
        position="0 0 6">

        <a-camera
          look-controls
          arrow-look
          wasd-controls-enabled="false">

          <a-entity
            id="hud"
            position="3 2 -3"
            hud-coords="target: #rig">
          </a-entity>

          <!-- set objectives -->
          <!-- can use different cookie key to have different objective list, not implimented but shouldt be too hard -->
          <script>
            document.addEventListener("DOMContentLoaded", () => {
              const scene = document.querySelector("a-scene");
              const hud = document.querySelector("#hud");

        // Define the objective list ONCE
        const LIST = [
          " ",
          "Travel through the pink teleporter to the campus map",
          "Explore to find the yellow teleporter and travel to the Christel DeHaan Center for Global Engagement",
          "Return to the campus map",
          "Find the purple teleporter near the park bench and travel through to the video room",
          "Watch some of the videos showing the UIndy experience. Return to the campus map when you are ready",
          "Find the orange teleporter and travel through it to reach the Perk III",
          "Return to the campus map",
          "Congratulations! You have finished the guided tour, feel free to explore where ever you wish"
        ];

              function setObjectives() {
                // normal init, keep progress if cookie exists
                initObjectives(hud, LIST);

                window.addEventListener("keydown", (e) => {
                  const k = e.key.toLowerCase();

                  // test complete
                  if (k === "o") hud.emit("hud-complete-objective");

            // reset with P
            if (k === "p") {
              deleteCookie("objectives_v2");      // hard delete
              initObjectives(hud, LIST, { reset: true, startIndex: 0 }); // re-seed cookie + HUD
              console.log("Reset objectives:", getCookie("objectives_v2"));
            }
          });
        }

              if (scene.hasLoaded) setObjectives();
              else scene.addEventListener("loaded", setObjectives);
            });
          </script>
      
        <!-- Cursor and raycaster for clicking -->
          <a-entity
            id="aimDot"
            class="cursor"
            cursor="fuse: false"
            raycaster="objects: .clickable"
            position="0 0 -1"
            geometry="primitive: circle; radius: 0.005"
            material="color: white; shader: flat">
          </a-entity>
        </a-camera>
      </a-entity>



<!------------------------------------------------------------------------------------------------------>
<!--                                          Main Hallway                                            -->
<!------------------------------------------------------------------------------------------------------>

    <!-- All assets go here -->
    <a-assets>
        
      <img id="groundTexture" src="images/concrete.jpg" alt="">
      <img id="classroomRef" src="images/GoodHall_Classroom.jpg" crossorigin="anonymous" />

    </a-assets>


<!------------------------------------------------------------------------------------------------------>
<!--                                        Begin Outer Shell                                           --> 
<!------------------------------------------------------------------------------------------------------>

    <!-- =========================
        ROOM SHELL
        ========================= -->

    <!-- BACK WALL of the room -->
    <a-entity
      blank-wall="width:12; height:4; thickness:0.15; color:#eaeaea; anchor:ground"
      position="0 0 12"
      rotation="0 0 0"
      collision="target: #rig; origin: 0 0 0; width: 12.2; height: 4; depth: 0.3; log: true; Yrot: 0">
    </a-entity>


    <!-- add teleporter (with con fig) to next html -->
    <a-entity
    teleport-pad="to: three_d_map.html;
                  width: 2.5;
                  color: #ffffff;
                  glowColor: #ffffff;
                  radius: 1.5;
                  fadetime: 1000"
    position="0 0 -10">
  </a-entity>


    <!-- LEFT WALL of the room -->
    <a-entity
      blank-wall="width:10; height:4; thickness:0.15; color:#eaeaea; anchor:ground"
      position="-6 0 7"
      rotation="0 90 0"
      collision="target: #rig; origin: 0 0 0; width: 10.2; height: 4; depth: 0.3; log: true; Yrot: 90">
    </a-entity>

    <!-- RIGHT WALL of the room -->
    <a-entity
      blank-wall="width:10; height:4; thickness:0.15; color:#eaeaea; anchor:ground"
      position="6 0 7"
      rotation="0 90 0"
      collision="target: #rig; origin: 0 0 0; width: 10.2; height: 4; depth: 0.3; log: true; Yrot: 90">
    </a-entity>

    <!-- FRONT WALL SEGMENTS of the room (doorway 4 m wide at z = +2) -->
    <a-entity
      blank-wall="width:4; height:4; thickness:0.15; color:#eaeaea; anchor:ground"
      position="-4 0 2"
      rotation="0 0 0"
      collision="target: #rig; origin: 0 0 0; width: 4.2; height: 4; depth: 2; log: true; Yrot: 0">
    </a-entity>

    <a-entity
      blank-wall="width:4; height:4; thickness:0.15; color:#eaeaea; anchor:ground"
      position="4 0 2"
      rotation="0 0 0"
      collision="target: #rig; origin: 0 0 0; width: 4.2; height: 4; depth: 2; log: true; Yrot: 0">
    </a-entity>


    <!-- =========================
        MAIN HALLWAY
        =========================
        Hallway width: 3 m (x=-1.5..+1.5)
        Hallway runs z = +2 ... -13
        Height: 4 m
    -->

    <!-- RIGHT HALLWAY WALL (continuous, unchanged) -->
    <a-entity
      blank-wall="width:15; height:4; thickness:0.15; color:#eaeaea; anchor:ground"
      position="2 0 -5.5"
      rotation="0 90 0"
      collision="target: #rig; origin: 0 0 0; width: 15.2; height: 4; depth: 3; log: true; Yrot: 90">
    </a-entity>

    <!-- LEFT HALLWAY WALL, FRONT SEGMENT
        Covers z = +2 down to z = -6.5
        length = 8.5
        midpoint z = -2.25
        Place at x = -1.5 (left side of hallway), rotate Y=90 so width runs along Z
    -->
    <a-entity
      blank-wall="width:8.5; height:4; thickness:0.15; color:#eaeaea; anchor:ground"
      position="-2 0 -2.25"
      rotation="0 90 0"
      collision="target: #rig; origin: 0 0 0; width: 8.7; height: 4; depth: 3; log: true; Yrot: 90">
    </a-entity>

    <!-- LEFT HALLWAY WALL, BACK SEGMENT
        Covers z = -9.5 down to z = -13
        length = 3.5
        midpoint z = -11.25
    -->
    <a-entity
      blank-wall="width:3.5; height:4; thickness:0.15; color:#eaeaea; anchor:ground"
      position="-2 0 -11.25"
      rotation="0 90 0"
      collision="target: #rig; origin: 0 0 0; width: 3.7; height: 4; depth: 3; log: true; Yrot: 90">
    </a-entity>

    <!-- HALLWAY END CAP at z = -13 -->
    <a-entity
      blank-wall="width:4; height:4; thickness:0.15; color:#eaeaea; anchor:ground"
      position="0 0 -13"
      rotation="0 0 0"
      collision="target: #rig; origin: 0 0 0; width: 4.2; height: 4; depth: 3; log: true; Yrot: 0">
    </a-entity>


    <!-- =========================
        BRANCH HALLWAY (to the left)
        =========================
        Branch intersects the main hallway through the gap
        which spans z = -9.5 .. -6.5.
        Branch width in Z is 3 m (same "opening height" along hallway).
        Branch runs left (negative X) for 6 m from x=-1.5 to x=-7.5.
        Same height: 4 m.
    -->

    <!-- BRANCH TOP WALL (toward +Z side of branch)
        Runs along X.
        width along X = 6 (from -7.5..-1.5)
        center x = -4.5
        This top edge sits at z = -6.5
    -->
    <a-entity
      blank-wall="width:6; height:4; thickness:0.15; color:#eaeaea; anchor:ground"
      position="-5 0 -6.5"
      rotation="0 0 0"
      collision="target: #rig; origin: 0 0 0; width: 14; height: 4; depth: 3; log: true; Yrot: 0">
    </a-entity>

    <!-- BRANCH BOTTOM WALL (toward -Z side of branch)
        Same width=6, same center x=-4.5,
        but sits at z = -9.5
    -->
    <a-entity
      blank-wall="width:6; height:4; thickness:0.15; color:#eaeaea; anchor:ground"
      position="-5 0 -9.5"
      rotation="0 0 0"
      collision="target: #rig; origin: 0 0 0; width: 14; height: 4; depth: 3; log: true; Yrot: 0">
    </a-entity>

    <!-- Roof -->
    <a-box 
      width="16" height="0.15" depth="30" color="#eaeaea"
      position="0 3 5"
      rotation="0 0 0">
    </a-box>

    <!-- Gap filler -->
     <a-box
        width="3" height="4" depth="0.15" color="#eaeaea"
        position="-8 5 -8"
        rotation="0 90 0"
        collision="target: #rig; origin: 0 0 0; width: 3.2; height: 4; depth: ; log: true; Yrot: 90">
    </a-box>




<!------------------------------------------------------------------------------------------------------>
<!--                                        End Outer Shell                                           --> 
<!-------------------------------------------------------------------------------------------------->


    <!-- Reliable ground collider
    <a-plane id="ground" src="#groundTexture"
             rotation="-90 0 0" width="1000" height="1000"
             static-body="shape: box"
             repeat="10 10"></a-plane> -->

    <a-plane id="ground" src="#groundTexture"
         rotation="-90 0 0" width="1000" height="1000"
         repeat="10 10"></a-plane>

</a-scene>  <!-- End A-Scene -->

</body>

</html>
