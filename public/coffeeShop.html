<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>VRXP - The Perk III</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- A-Frame (pinned to version compatible with extras v4.1.2) -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <!-- Physics system -->
    <script src="https://cdn.jsdelivr.net/npm/aframe-physics-system@4.0.1/dist/aframe-physics-system.min.js"></script>

    <!-- Components -->
    <script src="components/CoffeeShopComponents/ceiling.js"></script>
    <script src="components/CoffeeShopComponents/counter-display.js"></script>
    <script src="components/wasd-move.js"></script>
    <script src="components/arrow-look.js"></script>
    <script src="components/teleport-pad.js"></script>
    <script src="components/scene-fade.js"></script>
    <script src="components/hud.js"></script>
    <script src="components/cookies.js"></script>
    <script src="components/collision.js"></script>
    <!-- Physics system -->
    <script src="https://cdn.jsdelivr.net/npm/aframe-physics-system@4.0.1/dist/aframe-physics-system.min.js"></script>

    <!-- aframe-extras v4.1.2 (has kinematic-body + movement-controls) -->
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v4.1.2/dist/aframe-extras.min.js"></script>
    
    <!-- aframe-multisrc-component (for vending machine) -->
    <script src="https://cdn.rawgit.com/elbobo/aframe-multisrc-component/b6d23310/dist/0.3/aframe-multisrc-component.js"></script>
    
    <!-- Components -->
    <script src="components/CoffeeShopComponents/ceiling.js"></script>
    <script src="components/CoffeeShopComponents/counter-display.js"></script>
    <script src="components/CoffeeShopComponents/counter.js"></script>
    <script src="components/wasd-move.js"></script>
    <script src="components/arrow-look.js"></script>
    <script src="components/teleport-pad.js"></script>
    <script src="components/scene-fade.js"></script>
    <script src="components/hud.js"></script>

    <!-- Sky -->
    <script src="skybox/skycomponent.js"></script>

    <style>
      html, body { margin:0; height:100%; }
      .hud { position:absolute; top:8px; left:10px; font:14px system-ui; color:#fff; background:rgba(0,0,0,.35); padding:6px 8px; border-radius:6px; }
    </style>

  </head>

  <body>
    <a-scene
      scene-fade="duration: 800"
      renderer="colorManagement: true; physicallyCorrectLights: true"
      skybox-box="path: ./skybox/; ext: .jpg; rotTop: 1.5708; rotBottom: -1.5708; size: 1000">

      <!-- LIGHTS -->
      <a-entity light="type: ambient; intensity: 0.45"></a-entity>
      <a-entity light="type: directional; intensity: 1.0" position="2 6 2"></a-entity>

      <!-- create camera obj -->
      <a-entity id="rig"
        dynamic-body="mass:1"
        wasd-move-only="speed:10"
        position="-8 0 9">

        <a-camera
          look-controls
          arrow-look
          wasd-controls-enabled="false">

          <a-entity
            id="hud"
            position="3 2 -3"
            hud-coords="target: #rig">
          </a-entity>

          <!-- set objectives -->
          <!-- can use different cookie key to have different objective list, not implimented but shouldt be too hard -->
          <script>
            document.addEventListener("DOMContentLoaded", () => {
              const scene = document.querySelector("a-scene");
              const hud = document.querySelector("#hud");

        // Define the objective list ONCE
        const LIST = [
          " ",
          "Travel through the pink teleporter to the campus map",
          "Explore to find the yellow teleporter and travel to the Christel DeHaan Center for Global Engagement",
          "Read through the information available, and return to the campus map",
          "Find the purple teleporter near the park bench and travel through to the video room",
          "Watch some of the available videos depicting the UIndy experience",
          "Return to the campus map when you are ready to move on",
          "Find the orange teleporter and travel through it to reach the Perk III",
          "Return to the campus map",
          "Congratulations! You have finished the guided tour, feel free to explore where ever you wish"
        ];

              function setObjectives() {
                // normal init, keep progress if cookie exists
                initObjectives(hud, LIST);

                window.addEventListener("keydown", (e) => {
                  const k = e.key.toLowerCase();

                  // test complete
                  if (k === "o") hud.emit("hud-complete-objective");

                  // reset with P
                  if (k === "p") {
                    deleteCookie("objectives_v2");      // hard delete
                    initObjectives(hud, LIST, { reset: true, startIndex: 0 }); // re-seed cookie + HUD
                    console.log("Reset objectives:", getCookie("objectives_v2"));
                  }
                });
              }
                    function setObjectives() {
                      // Set a list, first one shows, next appears when completed
                      hud.emit("hud-set-objectives", {
                        list: [
                          "task 1",
                          "task 2",
                          "task 3"
                        ]
                      });

                      // Optional test: press O to complete the current objective
                      window.addEventListener("keydown", (e) => {
                        if (e.key.toLowerCase() === "o") {
                          hud.emit("hud-complete-objective");
                        }
                      });
                    }

              if (scene.hasLoaded) setObjectives();
              else scene.addEventListener("loaded", setObjectives);
            });
          </script>
      
        <!-- Cursor and raycaster for clicking -->
          <a-entity
            id="aimDot"
            class="cursor"
            cursor="fuse: false"
            raycaster="objects: .clickable"
            position="0 0 -1"
            geometry="primitive: circle; radius: 0.005"
            material="color: white; shader: flat">
          </a-entity>
        </a-camera>
      </a-entity>

      <!-- Import Textures -->
      <a-assets>
        <img id="groundTexture" src="images/concrete.jpg" alt="">
        <img id="BackCounter" src="images/CoffeeShopImages/back_counter.png" alt="">
        <img id="BackWall" src="images/CoffeeShopImages/back_wall.png" alt="">
        <img id="VendingMachineFront" src="images/CoffeeShopImages/vending_machine_front.jpg" alt="">
        <img id="VendingMachineSide" src="images/CoffeeShopImages/vending_machine_side.png" alt="">
        <img id="RedBoxSign" src="images/CoffeeShopImages/red_box_sign.jpg" alt="">
        <img id="CeilingTexture" src="images/CoffeeShopImages/ceiling.jpg" alt="">
        <img id="Windows" src="images/CoffeeShopImages/windows.jpg" alt="">
        <img id="Floor" src="images/CoffeeShopImages/coffee_shop_floor.jpg" alt="">
        <img id="LeftTrim" src="images/CoffeeShopImages/left_wall_trim.png" alt="">
        <img id="RightBox" src="images/CoffeeShopImages/right_red_box_texture.png" alt="">
      </a-assets>

      <!------------------------------------------------------------------------------------------------------>
      <!--                                          Main Area                                               -->
      <!------------------------------------------------------------------------------------------------------>

      <!-- TELEPORT PAD TO RETURN TO MAIN WORLD -->

      <a-entity
        teleport-pad="to: three_d_map.html;
          width: 2.5;
          color: #e06609;
          glowColor: #e06609;
          radius: 1.5;
          fadetime: 1000"
        position="-10 0 5">
      </a-entity>

      <!-- Walls -->

      <a-box
        collision="target: #rig; origin: 0 0 0; width: 20; height: 6; depth: 0.3; log: true; Yrot: 0"
        position="0 3 10"
        rotation="0 0 0"
        width="20"
        height="6"
        depth="0.3"
        color="#ffffff"
        material="src: #Windows; repeat: 4 1"
        static-body>
      </a-box>

      <a-box
        collision="target: #rig; origin: 0 0 0; width: 20; height: 6; depth: 0.3; log: true; Yrot: 90"
        position="10 3 0"
        rotation="0 90 0"
        width="20"
        height="6"
        depth="0.3"
        color="#ffffff"
        material="src: #Windows; repeat: 4 1"
        static-body>
      </a-box>

      <a-box
        position="0 4.5 0"
        rotation="0 90 0"
        width="20"
        height="0.3"
        depth="20"
        color="ffffff"
        material="src: #CeilingTexture; repeat: 2.8 4.2"
        static-body>
      </a-box>

      <!-- Ceiling and Trim (Both should have same width and height) -->

      <a-entity
        ceiling-trim="width: 7.5; length: 14.28; thickness: 0.2; depth: 0.6; color: #d41234"
        position="0 4 -1.7"
        rotation="90 90 0">
      </a-entity>

      <a-entity
        ceiling="width: 7.5; length: 14.28; depth: 0.29; color: #343434"
        position="0 4 -1.7"
        rotation="90 90 0">
      </a-entity>

      <!-- Back Wall of the Shop -->

      <a-box
        collision="target: #rig; origin: 0 0 0; width: 14.3; height: 4; depth: 0.3; log: true; Yrot: 0"
        position="0 2 -5.14"
        rotation="0 0 0"
        width="14.3"
        height="4"
        depth="0.3"
        color="#545454"
        static-body>
      </a-box>

      <a-plane src="#BackWall"
        position="-1.4 2.5 -4.84"
        width="6.25"
        height="3"
        rotation="0 0 0"
        static-body="shape: box">
      </a-plane>

      <a-box
        position="-1.4 1 -4.19"
        width="6.25"
        height="0.1"
        depth="1.3"
        color="#E2B49C"
        static-body>
      </a-box>

      <a-plane src="#BackCounter"
        position="-1.4 0.5 -3.84"
        width="6.25"
        height="1"
        rotation="0 0 0"
        static-body="shape: box">
      </a-plane>

      <!-- Left Red Box thing w/ sign -->

      <a-box
        collision="target: #rig; origin: 0 0 0; width: 2.86; height: 5; depth: 2.29; log: true"
        position="-6 2.5 -4.5"
        rotation="0 0 0"
        color = "#d41234"
        width="2.86"
        height="5"
        depth="2.29"
        static-body>
      </a-box>

      <a-plane src="#RedBoxSign"
        position="-6 2 -3.352"
        width="2.86"
        height="4"
        rotation="0 0 0"
        static-body="shape: box">
      </a-plane>

      <a-box
        material="src: #LeftTrim"
        position="-6.9 1.85 -3.8"
        rotation="0 0 0"
        width="0.75"
        height="3.7"
        depth="1"
        color="#ffffff"
        static-body>
      </a-box>

      <!-- Right Red Box thing -->

      <a-box
        collision="target: #rig; origin: 1 0 0; width: 5; height: 5; depth: 2.29; log: true"
        position="6.86 2.5 1.14"
        rotation="0 0 0"
        width="2.86"
        height="5"
        depth="2.29"
        color="#d41234"
        static-body>
      </a-box>

      <a-plane src="#RightBox"
        position="6.86 2 2.3"
        width="2.86"
        height="4"
        rotation="0 0 0"
        static-body="shape: box">
      </a-plane>

      <!-- Right Gray Wall w/ Doorway to Back Room -->

      <a-box
        collision="target: #rig; origin: 0 0 0; width: 1.14; height: 4; depth: 3.43; log: true; Yrot: 0"
        position="2.28 2 -3.43"
        rotation="0 0 0"
        width="1.14"
        height="4"
        depth="3.43"
        color="#545454"
        static-body>
      </a-box>

      <a-box
        collision="target: #rig; origin: 0 0 0; width: 4.57; height: 4; depth: 0.3; log: true; Yrot: 0"
        position="4.57 3.43 -3.43"
        rotation="0 0 0"
        width="4"
        height="1.71"
        depth="3.43"
        color="#545454"
        static-body>
      </a-box>

      <a-box
        collision="target: #rig; origin: 0 0 0; width: 1.14; height: 4; depth: 4.57; log: true; Yrot: 0"
        position="6.86 2 -2.29"
        rotation="0 0 0"
        width="1.14"
        height="4"
        depth="4.57"
        color="#545454"
        static-body>
      </a-box>

      <!-- Counter  -->

      <a-entity 
        counter-display-top="width: 0.4; height: 0.29; length: 2; color: #e6e6e6"
        position="-5.75 0 -3.05"
        rotation="0 3 0">
      </a-entity>

      <a-entity
        counter="width: 7; length: 8.5; depth: 1; color: #787878"
        position="-3.6 0.5 -1.7"
        rotation="90 90 0">
      </a-entity>

      <a-entity
        counter="width: 7.3; length: 8.8; depth: 0.1; color: #c4c4c4"
        position="-3.6 1.05 -1.7"
        rotation="90 90 0">
      </a-entity>

      <a-entity 
        counter-display="width: 0.4; height: 0.29; length: 3; color: #232323"
        position="-1.5 0 1.25"
        rotation="0 88 0">
      </a-entity>

      <a-entity 
        counter-display-top="width: 0.4; height: 0.29; length: 3; color: #e6e6e6"
        position="-1.5 0 1.25"
        rotation="0 88 0">
      </a-entity>

      <a-box
        position="3 0.5 1.4"
        rotation="0 -1 0"
        width="3"
        height="1"
        depth="1"
        color="#787878"
        static-body>
      </a-box>
      
      <a-box
        position="3 1.05 1.4"
        rotation="0 -1 0"
        width="3.2"
        height="0.1"
        depth="1.1"
        color="#c4c4c4"
        static-body>
      </a-box>

      <a-box
        collision="target: #rig; origin: 0 0 0; width: 11; height: 4; depth: 1; Yrot: 3; log: true"
        position="0 0.5 1.5"
        width="11"
        height="1"
        depth="1"
        color="#e410e4"
        rotation="0 -3 0"
        opacity="0"
        static-body="shape: box">
      </a-box>

      <a-box
        collision="target: #rig; origin: 0 0 0; width: 5; height: 4; depth: 1; Yrot: 87; log: true"
        position="-5.5 0.5 -1.5"
        width="5"
        height="1"
        depth="1"
        color="#e410e4"
        rotation="0 -87 0"
        opacity="0"
        static-body="shape: box">
      </a-box>

      <!-- Vending Machine -->

      <a-box
        position="4.8 1 1.4"
        rotation="0 -1 0"
        multisrc="src4:#VendingMachineFront;src1:#VendingMachineSide"
        width="1.2"
        height="2"
        depth="1.2"
        color="#ffffff"
        static-body>
      </a-box>

      <!-- Floor -->

      <a-plane material="src: #Floor; repeat: 6 10"
        position="0 0 0"
        width="20"
        height="20"
        rotation="-90 0 0"
        static-body="shape: box">
      </a-plane>

    </a-scene>
  </body>

</html>
