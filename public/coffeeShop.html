<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>VRXP - The Perk III</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- A-Frame (pinned to version compatible with extras v4.1.2) -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <!-- Physics system -->
    <script src="https://cdn.jsdelivr.net/npm/aframe-physics-system@4.0.1/dist/aframe-physics-system.min.js"></script>

    <!-- aframe-extras v4.1.2 (has kinematic-body + movement-controls) -->
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v4.1.2/dist/aframe-extras.min.js"></script>

    <!-- Components -->
    <script src="components/CoffeeShopComponents/ceiling.js"></script>
    <script src="components/CoffeeShopComponents/counter-display.js"></script>
    <script src="components/wasd-move.js"></script>
    <script src="components/arrow-look.js"></script>
    <script src="components/teleport-pad.js"></script>
    <script src="components/scene-fade.js"></script>
    <script src="components/hud.js"></script>
    <script src="components/cookies.js"></script>
    <script src="components/collision.js"></script>

    <!-- Sky -->
    <script src="skybox/skycomponent.js"></script>

    <style>
      html, body { margin:0; height:100%; }
      .hud { position:absolute; top:8px; left:10px; font:14px system-ui; color:#fff; background:rgba(0,0,0,.35); padding:6px 8px; border-radius:6px; }
    </style>

</head>

<body>
<a-scene
    scene-fade="duration: 800"
    renderer="colorManagement: true; physicallyCorrectLights: true"
    skybox-box="path: ./skybox/; ext: .jpg; rotTop: 1.5708; rotBottom: -1.5708; size: 1000">

    <!-- LIGHTS -->
    <a-entity light="type: ambient; intensity: 0.45"></a-entity>
    <a-entity light="type: directional; intensity: 1.0" position="2 6 2"></a-entity>

    <!-- create camera obj -->
    <a-entity id="rig"
          dynamic-body="mass:1"
          wasd-move-only="speed:10"
          position="0 0 6">

    <a-camera
      look-controls
      arrow-look
      wasd-controls-enabled="false">

      <a-entity
        id = "hud"
        position="3 2 -3"
        hud-coords="target: #rig">
      </a-entity>

    <!-- set objectives -->
    <!-- can use different cookie key to have different objective list, not implimented but shouldt be too hard -->
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const scene = document.querySelector("a-scene");
        const hud = document.querySelector("#hud");

        // Define the objective list ONCE
        const LIST = [
          " ",
          "Travel through the pink teleporter to the campus map",
          "Explore to find the green teleporter and travel to the Christel DeHaan Center for Global Engagement",
          "Read through the information avalible",
          "Return to the campus map",
          "Good Job boss you're free to explore the campus freely"
        ];

        function setObjectives() {
          // normal init, keep progress if cookie exists
          initObjectives(hud, LIST);

          window.addEventListener("keydown", (e) => {
            const k = e.key.toLowerCase();

            // test complete
            if (k === "o") hud.emit("hud-complete-objective");

            // reset with P
            if (k === "p") {
              deleteCookie("objectives_v2");      // hard delete
              initObjectives(hud, LIST, { reset: true, startIndex: 0 }); // re-seed cookie + HUD
              console.log("Reset objectives:", getCookie("objectives_v2"));
            }
          });
        }

        if (scene.hasLoaded) setObjectives();
        else scene.addEventListener("loaded", setObjectives);
      });
    </script>
      
        <!-- Cursor and raycaster for clicking -->
        <a-entity
          id="aimDot"
          class="cursor"
          cursor="fuse: false"
          raycaster="objects: .clickable"
          position="0 0 -1"
          geometry="primitive: circle; radius: 0.005"
          material="color: white; shader: flat">
        </a-entity>
      </a-camera>
    </a-entity>

    <img id="groundTexture" src="images/concrete.jpg" alt="">

<!------------------------------------------------------------------------------------------------------>
<!--                                          Main Area                                               -->
<!------------------------------------------------------------------------------------------------------>

    <!-- TELEPORT PAD TO RETURN TO MAIN WORLD -->

    <a-entity
        teleport-pad="to: index.html;
            width: 2.5;
            color: #c0d950;
            glowColor: #32c743;
            radius: 1.5;
            fadetime: 1000"
        position="0 0 20">
    </a-entity>

    <!-- Ceiling and Trim (Both should have same width and height) -->

    <a-entity
      ceiling-trim="width: 13; length: 25; thickness: 0.3; depth: 1; color: #d41234"
      position="0 7 -3"
      rotation="90 90 0">
    </a-entity>

    <a-entity
      ceiling="width: 13; length: 25; depth: 0.5; color: #343434"
      position="0 7 -3"
      rotation="90 90 0">
    </a-entity>

    <!-- Back Wall of the Shop -->

    <a-box
      collision="target: #rig; origin: 0 0 0; width: 25; height: 7; depth: 0.5; log: true; Yrot: 0"
      position="0 3.5 -9"
      rotation="0 0 0"
      width="25"
      height="7"
      depth="0.5"
      color="#545454"
      static-body>
    </a-box>

    <!-- Left Red Box thing -->

    <a-box
      collision="target: #rig; origin: 0 0 0; width: 5; height: 7; depth: 4; log: true"
      position="-10.5 3.5 -8"
      rotation="0 0 0"
      width="5"
      height="7"
      depth="4"
      color="#d41234"
      static-body>
    </a-box>

    <!-- Right Red Box thing -->

    <a-box
      collision="target: #rig; origin: 0 0 0; width: 5; height: 7; depth: 4; log: true"
      position="12 3.5 2"
      rotation="0 0 0"
      width="5"
      height="7"
      depth="4"
      color="#d41234"
      static-body>
    </a-box>

    <!-- Right Gray Wall w/ Doorway to Back Room -->

    <a-box
      collision="target: #rig; origin: 0 0 0; width: 2; height: 7; depth: 6; log: true; Yrot: 0"
      position="4 3.5 -6"
      rotation="0 0 0"
      width="2"
      height="7"
      depth="6"
      color="#545454"
      static-body>
    </a-box>

    <a-box
      collision="target: #rig; origin: 0 0 0; width: 7; height: 3; depth: 6; log: true; Yrot: 0"
      position="8 6 -6"
      rotation="0 0 0"
      width="7"
      height="3"
      depth="6"
      color="#545454"
      static-body>
    </a-box>

    <a-box
      collision="target: #rig; origin: 0 0 0; width: 2; height: 7; depth: 8; log: true; Yrot: 0"
      position="12 3.5 -4"
      rotation="0 0 0"
      width="2"
      height="7"
      depth="8"
      color="#545454"
      static-body>
    </a-box>

    <!-- Counter  -->

    <a-entity 
      collision="target: #rig; origin: 2 0 0; width: 4; height: 0.5; depth: 0.5; log: true; Yrot: 0"
      counter-display="width: 0.5; height: 0.5; length: 4; color: #000000"
      position="0 0 0"
      rotation="0 90 0">
    </a-entity>

    <!-- Reliable ground collider -->
    <a-plane id="ground" src="#groundTexture"
      rotation="-90 0 0" width="1000" height="1000"
      static-body="shape: box">
    </a-plane>
        
</a-scene>
</body>

</html>
