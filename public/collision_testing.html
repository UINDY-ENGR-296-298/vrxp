<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>VRXP - Collision Testing</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- Physics (Ammo.js) -->
    <script src="https://cdn.jsdelivr.net/npm/aframe-physics-system@4.0.1/dist/aframe-physics-system.min.js"></script>

  <!-- aframe-extras v4.1.2 -->
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v4.1.2/dist/aframe-extras.min.js"></script>

  <!-- Components -->
  <script src="components/wasd-move.js"></script>
  <script src="components/arrow-look.js"></script>
  <script src="components/teleport-pad.js"></script>
  <script src="components/scene-fade.js"></script>
  <script src="components/wall-text.js"></script>
  <script src="skybox/skycomponent.js"></script>
  <script src="components/collision.js"></script>

  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
    }
  </style>
</head>

<body>
  <a-scene
    physics="driver: ammo; debug: false; gravity: -9.8"
    scene-fade="duration: 800"
    renderer="colorManagement: true; physicallyCorrectLights: true"
    skybox-box="path: ./skybox/; ext: .jpg; rotTop: 1.5708; rotBottom: -1.5708; size: 1000">

    <!-- camera rig -->
    <a-entity id="rig"
      dynamic-body="mass: 1; shape: sphere; sphereRadius: 0.35; linearDamping: 0.9; angularDamping: 1"
      wasd-move-only="speed:20"
      position="0 0 5">

      <a-camera
        look-controls
        arrow-look
        wasd-controls-enabled="false">

      <a-entity
        position="-3 2 -3"
        hud-coords="target: #rig">
      </a-entity>

      <!-- your aim dot stays -->
      <a-entity
        id="aimDot"
        class="cursor"
        cursor="fuse: false"
        raycaster="objects: .clickable"
        position="0 0 -1"
        geometry="primitive: circle; radius: 0.005"
        material="color: white; shader: flat">
      </a-entity>

      </a-camera>
    </a-entity> 

    <!-- LIGHTS -->
    <a-entity light="type: ambient; intensity: 0.45"></a-entity>
    <a-entity light="type: directional; intensity: 1.0" position="2 6 2"></a-entity>

    <!-- Assets -->
    <a-assets>
      <!-- MSDF font assets (public/fonts/...) -->
      <a-asset-item id="robotoFont" src="/fonts/Roboto-msdf.json"></a-asset-item>
      <img id="robotoFontImg" src="/fonts/Roboto-msdf.png" crossorigin="anonymous" />

      <!-- Your textures -->
      <img id="groundTexture" src="images/grass_with_many_paths.png" alt="" />
      <!--<img id="pathTex" src="images/path_texture.jpg" alt="" />-->
    </a-assets>

    <!-- Ground collider -->
    <a-plane
      id="ground"
      src="#groundTexture"
      position="0 -2 0"
      rotation="-90 0 0"
      width="200"
      height="200"
      static-body="shape: box">
    </a-plane>

    <a-box
        collision="target: #rig; origin: 0 0 0; width: 5; height: 10; depth: 10; log: true"
        position="15 0 0"
        width="5"
        height="10"
        depth="10"
        color="#4CC3D9"
        static-body>
    </a-box>

    <a-sphere
        collision="target: #rig; origin: 0 0 0; radius: 2; log: true"
        position="0 0 -10"
        radius="1"
        color="#FF0000">
    </a-sphere>

  </a-scene>
</body>
</html>
