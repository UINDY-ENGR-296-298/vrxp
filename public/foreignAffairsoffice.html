<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>VRXP - The Perk III</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- A-Frame (pinned to version compatible with extras v4.1.2) -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <!-- Physics system -->
    <script src="https://cdn.jsdelivr.net/npm/aframe-physics-system@4.0.1/dist/aframe-physics-system.min.js"></script>

    <!-- aframe-extras v4.1.2 (has kinematic-body + movement-controls) -->
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v4.1.2/dist/aframe-extras.min.js"></script>

    <!-- Components -->
    <script src="components/blankwall.js"></script>
    <script src="components/chair.js"></script>
    <script src="components/table.js"></script>
    <script src="components/projector.js"></script>
    <script src="components/whiteboard.js"></script>
    <script src="components/projection-screen.js"></script>
    <script src="components/double-door.js"></script>
    <script src="components/window-pane.js"></script>
    <script src="components/ceiling-light-square.js"></script>
    <script src="components/air-vent.js"></script>
    <script src="components/classroom-floor.js"></script>
    <script src="components/CoffeeShopComponents/ceiling.js"></script>
    <script src="index.js"></script>
    <script src="components/tree_cluster.js"></script>
    <script src="components/wasd-move.js"></script>
    <script src="components/arrow-look.js"></script>
    <script src="components/teleport-pad.js"></script>
    <script src="components/scene-fade.js"></script>
    <script src="components/hud.js"></script>
    <script src="components/cookies.js"></script>

    <!-- Sky -->
    <script src="skybox/skycomponent.js"></script>
    <script src="components/chair_component.js"></script>
    <script src="components/videoscreen.js"></script>

    <style>
      html, body { margin:0; height:100%; }
      .hud { position:absolute; top:8px; left:10px; font:14px system-ui; color:#fff; background:rgba(0,0,0,.35); padding:6px 8px; border-radius:6px; }
    </style>

</head>

<body>
<a-scene
    scene-fade="duration: 800"
    renderer="colorManagement: true; physicallyCorrectLights: true"
    skybox-box="path: ./skybox/; ext: .jpg; rotTop: 1.5708; rotBottom: -1.5708; size: 1000">

    <!-- LIGHTS -->
    <a-entity light="type: ambient; intensity: 0.45"></a-entity>
    <a-entity light="type: directional; intensity: 1.0" position="2 6 2"></a-entity>

    <!-- create camera obj -->
    <a-entity id="rig"
          dynamic-body="mass:1"
          wasd-move-only="speed:20"
          position="-5.2 0 1">

    <a-camera
      look-controls
      arrow-look
      wasd-controls-enabled="false">

      <a-entity
        id = "hud"
        position="3 2 -3"
        hud-coords="target: #rig">
      </a-entity>

    <!-- set objectives -->
    <!-- can use different cookie key to have different objective list, not implimented but shouldt be too hard -->
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const scene = document.querySelector("a-scene");
        const hud = document.querySelector("#hud");

        // Define the objective list ONCE
        const LIST = [
          " ",
          "Travel through the pink teleporter to the campus map",
          "Explore to find the green teleporter and travel to the Christel DeHaan Center for Global Engagement",
          "Read through the information avalible",
          "Return to the campus map",
          "Good Job boss you're free to explore the campus freely"
        ];

        function setObjectives() {
          // normal init, keep progress if cookie exists
          initObjectives(hud, LIST);

          window.addEventListener("keydown", (e) => {
            const k = e.key.toLowerCase();

            // test complete
            if (k === "o") hud.emit("hud-complete-objective");

            // reset with P
            if (k === "p") {
              deleteCookie("objectives_v2");      // hard delete
              initObjectives(hud, LIST, { reset: true, startIndex: 0 }); // re-seed cookie + HUD
              console.log("Reset objectives:", getCookie("objectives_v2"));
            }
          });
        }

        if (scene.hasLoaded) setObjectives();
        else scene.addEventListener("loaded", setObjectives);
      });
    </script>

        <!-- Cursor and raycaster for clicking -->
        <a-entity
          id="aimDot"
          class="cursor"
          cursor="fuse: false"
          raycaster="objects: .clickable"
          position="0 0 -1"
          geometry="primitive: circle; radius: 0.005"
          material="color: white; shader: flat">
        </a-entity>
      </a-camera>
    </a-entity>

    <img id="groundTexture" src="images/concrete.jpg" alt="">

<!------------------------------------------------------------------------------------------------------>
<!--                                          Main Area                                            -->
<!------------------------------------------------------------------------------------------------------>

    <!-- TELEPORT PAD TO RETURN TO MAIN WORLD -->
    <a-entity
      teleport-pad="to: three_d_map.html;
                    width: 2.5;
                    color: #c0d950;
                    glowColor: #32c743;
                    radius: 1.5;
                    fadetime: 1000"
      position="-5.2 0 3.5">
    </a-entity>

    <!-- Back wall -->
    <a-box
  position="0 2.75 -4.5"
  width="14"
  height="5.5"
  depth="0.3"
  color="#d1d1d1"
  static-body>
</a-box>

    <!--Front wall-->
    <a-box
  position="0 2.75 4.5"
  width="14"
  height="5.5"
  depth="0.3"
  color="#d1d1d1"
  static-body>
</a-box>


    <!-- Left wall -->
    <a-box
  position="-7 2.75 0"
  width="0.3"
  height="5.5"
  depth="9"
  color="#d1d1d1"
  static-body>
</a-box>

     <!-- Right wall -->
    <a-box
  position="7 2.75 0"
  width="0.3"
  height="5.5"
  depth="9"
  color="#d1d1d1"
  static-body>
</a-box>


    
      <!--Back wall doors-->
    <a-box position="-4.8 1.5 -4.5" width="2.4" height="3.0" depth="0.35" color="#5a3a1e"></a-box>
<a-box position="-0.8 1.5 -4.5" width="2.4" height="3.0" depth="0.35" color="#5a3a1e"></a-box>
<a-box position="5.8 1.5 -4.5" width="2.4" height="3.0" depth="0.35" color="#5a3a1e"></a-box>




    <!--Front wall doors-->
    <a-box position="-5.8 1.5 4.5" width="2.4" height="3.0" depth="0.35" color="#5a3a1e"></a-box>
<a-box position="3.0 1.5 4.5"  width="2.4" height="3.0" depth="0.35" color="#5a3a1e"></a-box>


    <!--Right wall door-->
    <a-box position="7 1.5 0" width="0.35" height="3.0" depth="2.4" color="#5a3a1e"></a-box>


    <!--Desk-->
    <a-box
  position="-4.1 1 -2.3"
  width="5.8"
  height="1"
  depth="1.4"
  color="#6a6a6a"
  static-body>
</a-box>

<a-box
  position="-4.1 0.6 -1.6"

  depth="0.2"

<a-box
  position="-1.2 0.6 -2.3"
  width="0.2"
  height="1.2"
  depth="1.4"

<!--Ceiling-->
<a-plane
  position="0 5.55 0"
  rotation="90 0 0"
  width="14"
  height="9"
  color="#f2f2f2"
  static-body>
</a-plane>

<!--ceiling light-->
<a-entity
  light="type: point; intensity: 1.6; distance: 20; decay: 2"
  position="0 5 0">
</a-entity>

<!--Chairs-->
<a-entity classroom-chair position="-3.6 0 3.6" rotation="0 180 0" scale="1.4 1.4 1.4"></a-entity>
<a-entity classroom-chair position="-2.4 0 3.6" rotation="0 180 0" scale="1.4 1.4 1.4"></a-entity>
<a-entity classroom-chair position="-1.2 0 3.6" rotation="0 180 0" scale="1.4 1.4 1.4"></a-entity>
<a-entity classroom-chair position="0 0 3.6"   rotation="0 180 0" scale="1.4 1.4 1.4"></a-entity>
<a-entity classroom-chair position="1.2 0 3.6" rotation="0 180 0" scale="1.4 1.4 1.4"></a-entity>

<!-- Chair Componenet -->



    <!-- Reliable ground collider -->
    <a-plane id="ground" src="#groundTexture"
             rotation="-90 0 0" width="1000" height="1000"
             static-body="shape: box"></a-plane>
        
</a-scene>
</body>

</html>
