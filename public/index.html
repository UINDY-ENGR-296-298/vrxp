<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>VRXP - Load-In World</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- Physics system -->
  <script src="https://cdn.jsdelivr.net/npm/aframe-physics-system@4.0.1/dist/aframe-physics-system.min.js"></script>

  <!-- aframe-extras v4.1.2 -->
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v4.1.2/dist/aframe-extras.min.js"></script>

  <!-- Components -->
  <script src="components/wasd-move.js"></script>
  <script src="components/arrow-look.js"></script>
  <script src="components/teleport-pad.js"></script>
  <script src="components/scene-fade.js"></script>
  <script src="skybox/skycomponent.js"></script>
  <script src="components/hud.js"></script>
  <script src="components/ComplexComponents/spawn_room.js"></script>



  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
    }
  </style>
</head>

<body>
  <a-scene
    scene-fade="duration: 800"
    renderer="colorManagement: true; physicallyCorrectLights: true"
    skybox-box="path: ./skybox/; ext: .jpg; rotTop: 1.5708; rotBottom: -1.5708; size: 1000">

    <!-- camera rig -->
    <a-entity id="rig"
      dynamic-body="mass:1"
      wasd-move-only="speed:20"
      position="0 0 5">

      <a-camera
        look-controls
        arrow-look
        wasd-controls-enabled="false">

      <a-entity
        id = "hud"
        position="3 2 -3"
        hud-coords="target: #rig">
      </a-entity>

<!--Set objectives -->
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const scene = document.querySelector("a-scene");
    const hud = document.querySelector("#hud");

    function setObjectives() {
      // Set a list, first one shows, next appears when completed
      hud.emit("hud-set-objectives", {
        list: [
          " ",
          "Travel through the pink teleporter to the campus map",
          "Reach the exit"
        ]
      });

      // Optional test: press O to complete the current objective
      window.addEventListener("keydown", (e) => {
        if (e.key.toLowerCase() === "o") {
          hud.emit("hud-complete-objective");
        }
      });
    }

    // Wait until the A-Frame scene is fully loaded
    if (scene.hasLoaded) setObjectives();
    else scene.addEventListener("loaded", setObjectives);
  });
  </script>


      <!--aim dot-->
      <a-entity
        id="aimDot"
        class="cursor"
        cursor="fuse: false"
        raycaster="objects: .clickable"
        position="0 0 -1"
        geometry="primitive: circle; radius: 0.005"
        material="color: white; shader: flat">
      </a-entity>

      </a-camera>
    </a-entity>

    <!-- LIGHTS -->
    <a-entity light="type: ambient; intensity: 0.45"></a-entity>
    <a-entity light="type: directional; intensity: 1.0" position="2 6 2"></a-entity>

    <!-- Assets -->
    <a-assets>
      <!-- MSDF font assets (public/fonts/...) -->
      <a-asset-item id="robotoFont" src="/fonts/Roboto-msdf.json"></a-asset-item>
      <img id="robotoFontImg" src="/fonts/Roboto-msdf.png" crossorigin="anonymous" />

      <!-- Your textures -->
      <img id="groundTexture" src="images/concrete.jpg" alt="" />
      <img id="pathTex" src="images/path_texture.jpg" alt="" />
    </a-assets>

    <!-- Ground collider -->
    <a-plane
      id="ground"
      src="#groundTexture"
      position="0 -2 0"
      rotation="-90 0 0"
      width="1000"
      height="1000"
      static-body="shape: box">
    </a-plane>


    <a-entity
      teleport-pad="to: three_d_map.html;
                      width: 2.5;
                      color: #cb4abc;
                      glowColor: #a01fa7;
                      radius: 1.5;
                      fadetime: 1000"
      position="0 0 -13">
    </a-entity>

    <!-- Easter Egg -->
    <a-entity 
      teleport-pad="to: chang.html; radius: 1.5"
      position="0 0 100">
    </a-entity>

  </a-scene>
</body>
</html>
