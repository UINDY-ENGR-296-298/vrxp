<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>AFrame+WebXR</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- A-Frame (pinned to version compatible with extras v4.1.2) -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>

    <!-- Physics system -->
    <script src="https://cdn.jsdelivr.net/npm/aframe-physics-system@4.0.1/dist/aframe-physics-system.min.js"></script>

    <!-- aframe-extras v4.1.2 (has kinematic-body + movement-controls) -->
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v4.1.2/dist/aframe-extras.min.js"></script>

    <!-- Components -->
    <script src="components/blankwall.js"></script>
    <script src="index.js"></script>
    <!-- Sky -->
    <script src="skybox/alt_sky.js"></script>
    <script src="components/chair_component.js"></script>

</head>
<body>

<a-scene
        renderer="colorManagement: true; physicallyCorrectLights: true"
        physics="gravity: -9.8; debug: false"
        skybox-box="path: ./skybox/; ext: .jpg; rotTop: 1.5708; rotBottom: -1.5708">

    <!-- Player RIG with collisions -->

<!--    <a-entity id="rig"-->
<!--              position="0 2 0"-->
<!--              movement-controls-->
<!--              kinematic-body="radius: 0.35; height: 1.6; offset: 0 0.8 0">-->
<!--        <a-entity camera look-controls position="0 1.6 0"></a-entity>-->
<!--    </a-entity>-->

    <a-assets>
        <img id="groundTexture" src="images/concrete.jpg" alt="">
        <img id="skyTexture" src="images/fantasy_sky.jpg" alt="">
    </a-assets>

<!------------------------------------------------------------------------------------------------------>
<!--                                          Main Hallway                                            -->
<!------------------------------------------------------------------------------------------------------>

    <!-- Blank wall to the right -->
    <a-entity
        blank-wall="width: 60; height: 15; thickness: 0.5; units: ft; color: #eaeaea; anchor: ground"
        position="9 0 0"
        rotation="0 90 0">
    </a-entity>

    <!-- Blank wall to the left -->
    <a-entity
        blank-wall="width: 60; height: 15; thickness: 0.5; units: ft; color: #eaeaea; anchor: ground"
        position="-9 0 0"
        rotation="0 90 0">
    </a-entity>

    <!-- Blank wall behind -->
    <a-entity
        blank-wall="width: 60; height: 15; thickness: 0.5; units: ft; color: #eaeaea; anchor: ground"
        position="0 0 9"
        rotation="0 0 0">
    </a-entity>

    <!-- Blank wall front-left -->
    <a-entity
        blank-wall="width: 20; height: 15; thickness: 0.5; units: ft; color: #eaeaea; anchor: ground"
        position="-6 0 -9"
        rotation="0 0 0">
    </a-entity>

    <!-- Blank wall front-right -->
    <a-entity
        blank-wall="width: 20; height: 15; thickness: 0.5; units: ft; color: #eaeaea; anchor: ground"
        position="6 0 -9"
        rotation="0 0 0">
    </a-entity>

    <!-- Blank wall hallway left -->
    <a-entity
        blank-wall="width: 60; height: 15; thickness: 0.5; units: ft; color: #eaeaea; anchor: ground"
        position="-3 0 -18"
        rotation="0 90 0">
    </a-entity> 
    <a-entity
        blank-wall="width: 20; height: 15; thickness: 0.5; units: ft; color: #eaeaea; anchor: ground"
        position="-3 0 -33"
        rotation="0 90 0">
    </a-entity> 
    
    <!-- Blank wall hallway right -->
    <a-entity
        blank-wall="width: 89; height: 15; thickness: 0.5; units: ft; color: #eaeaea; anchor: ground"
        position="3 0 -22.5"
        rotation="0 90 0">
    </a-entity> 

    <!-- Blank wall end of hallway -->
    <a-entity
        blank-wall="width: 20; height: 15; thickness: 0.5; units: ft; color: #eaeaea; anchor: ground"
        position="0 0 -36"
        rotation="0 0 0">
    </a-entity>

    <!-- Classroom branchoff hallway left -->
    <a-entity
        blank-wall="width: 30; height: 15; thickness: 0.5; units: ft; color: #eaeaea; anchor: ground"
        position="-7.5 0 -27.1"
        rotation="0 0 0">
    </a-entity>
    <!-- Classroom branchoff hallway right -->
    <a-entity
        blank-wall="width: 30; height: 15; thickness: 0.5; units: ft; color: #eaeaea; anchor: ground"
        position="-7.5 0 -30"
        rotation="0 0 0">
    </a-entity>

    <a-entity
    blank-wall="width: 20; height: 15; thickness: 0.5; units: ft; color: #eaeaea; anchor: ground"
    position="0 0 -36"
    rotation="0 0 0">
    </a-entity>

    <!-- Chair Componenet -->
    <a-entity chair="
          position: -15 0 -28.5;
          rotation: 0 180 0;
          scale: 1 1 1;

          width: 0.6;
          depth: 0.6;
          seatHeight: 0.46;
          seatThickness: 0.045;
          backHeight: 0.95;
          backThickness: 0.03;
          legThickness: 0.04;
          legInset: 0.03;

          color: #8d6e63;
          legColor: #4e342e;
          metalness: 0.15;
          roughness: 0.85
        "
              position="0 0 -2">
    </a-entity>

    <!-- Reliable ground collider -->
    <a-plane id="ground" src="#groundTexture"
             rotation="-90 0 0" width="1000" height="1000"
             static-body="shape: box"></a-plane>

</a-scene>

</body>
</html>
