<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Computer Lab (A-Frame)</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
    </style>

    <script>
        (function () {
            const origin = new AFRAME.THREE.Vector3(-10, 0, -7);
            const ROOM_W = 8.8392;
            const ROOM_D = 7.3152;
            const WALL_H = 4.2672;
            const WALL_T = 0.1;

            function ensureRoot(scene) {
                let root = scene.querySelector('#lab-root');
                if (!root) {
                    root = document.createElement('a-entity');
                    root.id = 'lab-root';
                    scene.appendChild(root);
                }
                if (root.dataset.built === 'true') return null;
                root.dataset.built = 'true';
                root.setAttribute(
                    'position',
                    `${origin.x} ${origin.y} ${origin.z}`
                );
                return root;
            }

            function buildLab(root) {
                const lab = document.createElement('a-entity');
                lab.id = 'computer-lab';
                root.appendChild(lab);

                // Floor
                const floor = document.createElement('a-plane');
                floor.setAttribute('width', ROOM_W);
                floor.setAttribute('height', ROOM_D);
                floor.setAttribute('color', '#d8dee9');
                floor.setAttribute('rotation', '-90 0 0');
                lab.appendChild(floor);

                // Walls
                function makeWall(w, h, color, pos, rot) {
                    const wall = document.createElement('a-box');
                    wall.setAttribute('width', w);
                    wall.setAttribute('height', h);
                    wall.setAttribute('depth', WALL_T);
                    wall.setAttribute('color', color);
                    wall.setAttribute('position', pos);
                    if (rot) wall.setAttribute('rotation', rot);
                    lab.appendChild(wall);
                }

                makeWall(ROOM_W, WALL_H, '#ffffff', `0 ${WALL_H / 2} ${-ROOM_D / 2}`);
                makeWall(ROOM_W, WALL_H, '#ffffff', `0 ${WALL_H / 2} ${ROOM_D / 2}`, '0 180 0');
                makeWall(ROOM_D, WALL_H, '#ffffff', `${-ROOM_W / 2} ${WALL_H / 2} 0`, '0 90 0');
                makeWall(ROOM_D, WALL_H, '#ffffff', `${ROOM_W / 2} ${WALL_H / 2} 0`, '0 -90 0');
            }

            function onSceneReady() {
                const scene = document.querySelector('a-scene');
                const root = ensureRoot(scene);
                if (root) buildLab(root);
            }

            document.addEventListener('DOMContentLoaded', () => {
                const scene = document.querySelector('a-scene');
                if (scene.hasLoaded) onSceneReady();
                else scene.addEventListener('loaded', onSceneReady);
            });
        })();
    </script>
</head>

<body>
    <a-scene background="color: #e5e9f0">
        <a-entity camera
                  position="0 1.6 8"
                  look-controls
                  wasd-controls>
        </a-entity>

        <a-entity light="type: directional; color: #fff; intensity: 0.9"
                  position="1 4 2">
        </a-entity>

        <a-entity light="type: ambient; color: #ccc"></a-entity>
    </a-scene>
</body>
</html>
