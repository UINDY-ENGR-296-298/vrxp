<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>VRXP - 3D UIndy Map</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- A-Frame (pinned to version compatible with extras v4.1.2) -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <!-- Physics system -->
    <script src="https://cdn.jsdelivr.net/npm/aframe-physics-system@4.0.1/dist/aframe-physics-system.min.js"></script>

    <!-- aframe-extras v4.1.2 (has kinematic-body + movement-controls) -->
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v4.1.2/dist/aframe-extras.min.js"></script>

    <!--Components-->
    <script src="components/wasd-move.js"></script>
    <script src="components/arrow-look.js"></script>
    <script src="components/teleport-pad.js"></script>
    <script src="components/scene-fade.js"></script>
    <script src="skybox/skycomponent.js"></script>
    <script src="components/ComplexComponents/campus_map.js"></script>
    <script src="components/hud.js"></script>
    <script src="components/cookies.js"></script>
    <script src = "components/collision.js"></script>

    <style>
      html, body {
      margin: 0;
      height: 100%;
      overflow: hidden; /* prevents arrow keys from scrolling the page */
    }
    </style>

</head>

<body>

<a-scene

    scene-fade="duration: 800"
    renderer="colorManagement: true; physicallyCorrectLights: true"
    skybox-box="path: ./skybox/; ext: .jpg; rotTop: 1.5708; rotBottom: -1.5708; size: 1000">

    <!-- All assets go here -->
    <a-assets>
      
      <img id="groundTexture" src="images/concrete.jpg" alt="">

    </a-assets>
    <!--  End all assets -->

    <!-- create camera obj -->
    <a-entity id="rig"
          dynamic-body="mass:1"
          wasd-move-only="speed:40"
          position="0 0 25">

    <a-camera
      look-controls
      arrow-look
      wasd-controls-enabled="false">

      <a-entity
        id = "hud"
        position="3 2 -3"
        hud-coords="target: #rig">
      </a-entity>

  <!-- set objectives -->
  <!-- can use different cookie key to have different objective list, not implimented but shouldt be too hard -->
  <script>
  document.addEventListener("DOMContentLoaded", () => {
    const scene = document.querySelector("a-scene");
    const hud = document.querySelector("#hud");

    // Define the objective list ONCE
    const LIST = [
      " ",
      "Travel through the pink teleporter to the campus map",
      "Explore to find the green teleporter and travel to the Christel DeHaan Center for Global Engagement",
      "Read through the information avalible",
      "Return to the campus map",
      "Good Job boss you're free to explore the campus freely"
    ];

    function setObjectives() {
      // normal init, keep progress if cookie exists
      initObjectives(hud, LIST);

      window.addEventListener("keydown", (e) => {
        const k = e.key.toLowerCase();

        // test complete
        if (k === "o") hud.emit("hud-complete-objective");

        // reset with P
        if (k === "p") {
          deleteCookie("objectives_v2");      // hard delete
          initObjectives(hud, LIST, { reset: true, startIndex: 0 }); // re-seed cookie + HUD
          console.log("Reset objectives:", getCookie("objectives_v2"));
        }
      });
    }

    if (scene.hasLoaded) setObjectives();
    else scene.addEventListener("loaded", setObjectives);
  });
</script>

        <!-- Cursor and raycaster for clicking -->
        <a-entity
          id="aimDot"
          class="cursor"
          cursor="fuse: false"
          raycaster="objects: .clickable"
          position="0 0 -1"
          geometry="primitive: circle; radius: 0.005"
          material="color: white; shader: flat">
        </a-entity>
      </a-camera>
    </a-entity>

    <!-- add teleporter to index.html -->
    <a-entity
      teleport-pad="to: index.html;
                      width: 2.5;
                      color: #cb4abc;
                      glowColor: #a01fa7;
                      radius: 1.5;
                      fadetime: 1000"
      position="0 0 -37.5">
    </a-entity>

    <!-- 3D Model Library -->
    <a-entity
      gltf-model="models_ChatGPT/krannert_memorial_library_proxy_v6/model.gltf"
      position="23 0 72"
      rotation="0 180 0"
      scale="1 1 1">
    </a-entity>
    <!-- Collision -->
    <a-box
      collision="target: #rig; origin: 0 0 10; width: 130; height: 40; depth: 40; log: true; Yrot: 0"
      position="23 0 72"
      rotation="0 0 0"
      visible="false">
    </a-box>

    <!-- add teleporter to Krannert Coffee Shop -->
    <a-entity
      teleport-pad="to: coffeeShop.html;
                      width: 2.5;
                      color: #c0d950;
                      glowColor: #32c743;
                      radius: 1.5;
                      fadetime: 1000"
      position="0 0 59.5">
    </a-entity>

    <!-- 3D Model Schwitzer -->
    <!-- <a-entity
      gltf-model="models_ChatGPT/schwitzer_student_center_proxy_v2_gltf/schwitzer_student_center_proxy_v2/model.gltf"
      position="0 0 -30"
      rotation="0 0 0"
      scale="1 1 1">
    </a-entity> -->

    <!-- add teleporter to Foreign Affairs Office -->
    <a-entity
      teleport-pad="to: foreignAffairsoffice.html;
                    width: 2.5;
                    color: #c0d950;
                    glowColor: #32c743;
                    radius: 1.5;
                    fadetime: 1000"
      position="27 0 -100">
    </a-entity>

    <!-- 3D Model Martin/Lilly -->
    <a-entity
      gltf-model="models_ChatGPT/martin_lilly_proxy_v16_gltf/model.gltf"
      position="-30 0 -2"
      rotation="0 0 0"
      scale="0.75 0.75 0.75">
    </a-entity>
    <!-- Collision -->
    <a-box
      collision="target: #rig; origin: 0 0 0; width: 47; height: 40; depth: 25; log: true; Yrot: 90"
      position="-109 0 -51"
      rotation="0 0 0"
      visible="false">
    </a-box>
    <a-box
      collision="target: #rig; origin: 0 0 0; width: 25; height: 40; depth: 13; log: true; Yrot: 0"
      position="-131 0 -69"
      rotation="0 0 0"
      visible="false">
    </a-box>
    <a-box
      collision="target: #rig; origin: 0 0 0; width: 64; height: 40; depth: 33; log: true; Yrot: 0"
      position="-116 0 12"
      rotation="0 0 0"
      visible="false">
    </a-box>
    <a-box
      collision="target: #rig; origin: 0 0 0; width: 28; height: 40; depth: 12; log: true; Yrot: 90"
      position="-142 0 -19"
      rotation="0 0 0"
      visible="false">
    </a-box>

    <!-- LIGHTS -->
    <a-entity light="type: ambient; intensity: 0.45"></a-entity>
    <a-entity light="type: directional; intensity: 1.0" position="2 6 2"></a-entity>

    <!-- Reliable ground collider -->
    <a-plane id="ground" src="#groundTexture"
             position="0 -2 0"
             rotation="-90 0 0" width="1000" height="1000"
             static-body="shape: box"></a-plane>

    <!-- Easter Egg -->
    <a-entity 
      teleport-pad="to: chang.html; radius: 1.5"
      position="-141.22 0 -4.88">
    </a-entity>


</a-scene>  <!-- End A-Scene -->

</body>

</html>
